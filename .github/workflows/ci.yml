name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    # A branch push and its pull request would otherwise run the same commit
    # twice; pull_request runs are kept only for forks, whose pushes never
    # trigger this repo's workflows.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate frontmatter and generate LLM artifacts
        run: npm run generate

      - name: Check committed LLM artifacts are up to date
        run: |
          if ! git diff --exit-code --stat docs/public; then
            echo "::error::docs/public is stale. Run 'npm run generate' and commit the result."
            exit 1
          fi

      - name: Check demo registry
        run: npm run demos:check

      - name: Type-check demos
        run: npm run demos:typecheck

      - name: Type-check
        run: npm run typecheck

      - name: Build site
        run: npx vitepress build docs

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Check built pages for console errors
        run: npm run check:pages
