name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling runs queued between the
# run in-progress and latest queued. Do not cancel in-progress runs, to let
# production deployments complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Install dependencies
        run: npm ci

      # build covers the demos but not scripts/ or .vitepress/*.ts, and ci.yml
      # does not run on main.
      - name: Type-check
        run: npm run typecheck

      - name: Build site
        run: npm run build

      # build regenerates docs/public, so the deployed site is always current;
      # a direct push to main can still leave the committed copies (which agents
      # read from the repo) behind. Flag it without blocking the deploy.
      - name: Check committed LLM artifacts are up to date
        run: |
          if ! git diff --exit-code --stat docs/public; then
            echo "::warning::docs/public on main is stale. Run 'npm run generate' and commit the result."
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Check built pages for console errors
        run: npm run check:pages

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
